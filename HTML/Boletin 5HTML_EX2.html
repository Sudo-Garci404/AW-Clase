<html lang="es">
<head>
<title>Boletin 5 HTML(2)</title>
</head>
<body>
 <table style="border: 1px solid black">
   <caption>Táboa: Agrupación de celas en horizontal e vertical</caption>
   <tr>
     <th style="border: 1px solid black">Encabezado 1</th>
     <th style="border: 1px solid black">Encabezado 2</th>
     <th style="border: 1px solid black">Encabezado 3</th>
     <th style="border: 1px solid black">Encabezado 4</th>
   </tr>
   <tr>
     <td rowspan="2" style="border: 1px solid black"> Campo 1</td>
     <td style="border: 1px solid black"> Campo 2</td>
     <td style="border: 1px solid black"> Campo 3</td>
     <td style="border: 1px solid black"> Campo 4</td>
   </tr>
   <tr>
     <td colspan="2" style="border: 1px solid black"> Campo 6</td>
     <td style="border: 1px solid black"> Campo 8</td>
   </tr>
   <tr>
     <td style="border: 1px solid black"> Campo 10</td>
     <td style="border: 1px solid black"> Campo 11</td>
     <td colspan="2" rowspan="2" style="border: 1px solid black"> Campo 12</td>
   </tr>
   <tr>
     <td style="border: 1px solid black"> Campo 13</td>
     <td style="border: 1px solid black"> Campo 14</td>
   </tr>
 </table>
</body>
